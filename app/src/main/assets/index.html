<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>트렌드 레이더</title>
<style>
:root{--bg:#F6F3EE;--ink:#1E2A3A;--sub:#6B7280;--line:#E7E1D8;--card:#fff;--acc:#E2574C;--gold:#F2B36B;--ok:#2E9E6B;--mid:#D9902B;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"Noto Sans KR","Apple SD Gothic Neo",Roboto,sans-serif;font-size:15px}
button{font:inherit;border:0;cursor:pointer}
input{font:inherit}
.wrap{max-width:640px;margin:0 auto;padding:16px 16px 90px}
h1{font-size:26px;margin:6px 0 2px;letter-spacing:-.5px}
h2{font-size:18px;margin:22px 0 10px}
.muted{color:var(--sub);font-size:13px}
.hero{background:var(--ink);color:#fff;border-radius:22px;padding:20px 18px;margin:8px 0 14px;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-40px;top:-40px;width:170px;height:170px;border-radius:50%;border:2px solid rgba(255,255,255,.12);box-shadow:0 0 0 26px rgba(255,255,255,.05)}
.hero b{color:var(--gold)}
.row{display:flex;gap:8px;align-items:center}
.inp{flex:1;min-width:0;width:100%;padding:13px 14px;border-radius:14px;border:1.5px solid var(--line);background:#fff;outline:none}
.inp:focus{border-color:var(--ink)}
.btn{flex:none;white-space:nowrap;padding:13px 16px;border-radius:14px;background:var(--ink);color:#fff;font-weight:700}
.btn.acc{background:var(--acc)}
.btn.ghost{background:#fff;color:var(--ink);border:1.5px solid var(--line)}
.btn.big{width:100%;padding:16px;font-size:17px;margin-top:14px}
.btn:disabled{opacity:.45}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
.chip{padding:8px 12px;border-radius:999px;background:#fff;border:1.5px solid var(--line);font-size:14px}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.chip.sel{background:var(--acc);color:#fff;border-color:var(--acc)}
.chip .x{margin-left:6px;opacity:.8}
.card{background:var(--card);border-radius:18px;padding:14px;margin:10px 0;border:1px solid var(--line)}
.list .card{display:flex;align-items:center;gap:12px}
.list .card .t{flex:1;min-width:0}
.list .card .t b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.thumb{width:54px;height:54px;border-radius:12px;background:#EEE8DF center/cover no-repeat;flex:none}
.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0 8px;display:flex;align-items:center;gap:10px}
.back{width:40px;height:40px;border-radius:12px;background:#fff;border:1px solid var(--line);font-size:20px}
.top .ttl{flex:1;min-width:0}
.top .ttl b{font-size:19px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:4px 0 10px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;padding:9px 13px;border-radius:12px;background:#fff;border:1px solid var(--line);font-weight:600;font-size:14px}
.tab.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.item{background:#fff;border-radius:16px;overflow:hidden;border:1px solid var(--line);position:relative;text-align:left;padding:0;color:inherit}
.item .ph{aspect-ratio:3/4;background:#EEE8DF center/cover no-repeat;display:flex;align-items:center;justify-content:center;color:#B5AB9C;font-size:28px}
.item .ph.load{animation:pulse 1.3s infinite}
@keyframes pulse{50%{opacity:.55}}
.item .info{padding:9px 10px 11px}
.item .nm{font-weight:700;font-size:14px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.item .ty{font-size:12px;color:var(--sub);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badges{position:absolute;left:7px;top:7px;display:flex;gap:4px;flex-wrap:wrap}
.bd{font-size:11px;font-weight:800;padding:3px 7px;border-radius:8px;background:rgba(30,42,58,.86);color:#fff}
.bd.g{background:var(--ok)}.bd.m{background:var(--mid)}.bd.r{background:#9CA3AF}
.num:empty{display:none}
.num{position:absolute;right:7px;top:7px;font-size:11px;font-weight:800;background:#fff;border-radius:8px;padding:3px 7px}
.sum{background:#fff;border-radius:16px;padding:13px 14px;border:1px solid var(--line);line-height:1.55;font-size:14px;margin-bottom:10px}
.note{background:#FFF4E5;border:1px solid #F5D8A8;border-radius:14px;padding:10px 12px;font-size:13px;margin-bottom:10px}
.err{background:#FDECEA;border:1px solid #F5C2BC;border-radius:14px;padding:12px;font-size:14px;margin:10px 0}
.spin{display:inline-block;width:16px;height:16px;border:2.5px solid #ccc;border-top-color:var(--acc);border-radius:50%;animation:sp 1s linear infinite;vertical-align:-3px;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}
.sheet{position:fixed;inset:0;background:var(--bg);z-index:20;overflow-y:auto}
.gal{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:6px;background:#EEE8DF;scrollbar-width:none}
.gal::-webkit-scrollbar{display:none}
.gal img{flex:none;width:100%;aspect-ratio:3/4;object-fit:cover;scroll-snap-align:center;background:#EEE8DF}
.galbox{position:relative;border-radius:18px;overflow:hidden}
.galcnt{position:absolute;right:10px;bottom:10px;background:rgba(0,0,0,.6);color:#fff;font-size:12px;padding:4px 9px;border-radius:10px}
.noimg{aspect-ratio:3/4;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--sub);text-align:center;padding:20px}
.kv{display:grid;grid-template-columns:88px 1fr;gap:8px 10px;font-size:14px;line-height:1.45}
.kv .k{color:var(--sub)}
.score{display:flex;align-items:center;gap:12px}
.score .c{width:58px;height:58px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:19px;color:#fff;flex:none}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.acts .btn{padding:12px 8px;font-size:14px}
.sel{padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:#fff;font:inherit;font-size:13px}
.vid{display:flex;gap:10px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:14px;padding:8px;margin:8px 0;text-align:left;width:100%;color:inherit}
.vid .vt{width:120px;aspect-ratio:16/9;border-radius:10px;background:#222 center/cover;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;font-size:22px}
.pick{display:block;width:100%;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:12px;margin:8px 0;color:inherit}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40;display:flex;align-items:flex-end}
.modal .box{background:var(--bg);width:100%;max-height:85vh;overflow-y:auto;border-radius:22px 22px 0 0;padding:18px 16px 26px}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 16px;border-radius:12px;z-index:60;font-size:14px;max-width:88%;text-align:center}
.sw{display:flex;align-items:center;justify-content:space-between;gap:10px}
a{color:var(--acc)}
.qa{margin:10px 0}.qa .q{background:var(--ink);color:#fff;border-radius:16px 16px 4px 16px;padding:10px 13px;margin-left:15%;font-size:14.5px;line-height:1.5}
.qa .a{background:#fff;border:1px solid var(--line);border-radius:16px 16px 16px 4px;padding:11px 13px;margin:8px 15% 0 0;font-size:14.5px;line-height:1.6}
.ask{position:sticky;bottom:0;background:var(--bg);padding:10px 0 12px;display:flex;gap:8px;align-items:flex-end}
.ask textarea{flex:1;min-width:0;resize:none;padding:12px 13px;border-radius:14px;border:1.5px solid var(--line);font:inherit;max-height:120px;outline:none}
.shop{font-size:14px;line-height:1.5}.shop .btns{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.shop .btns .chip{font-size:13px}
.fc{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px;margin:10px 0}
.fc .hd{display:flex;align-items:center;gap:12px}.fc .sw{width:54px;height:54px;border-radius:50%;flex:none;border:1px solid rgba(0,0,0,.08);display:flex;align-items:center;justify-content:center;font-size:26px;background:#F1ECE4}
.fc .nm{font-weight:800;font-size:16px}.fc .rk{font-size:12px;font-weight:800;color:var(--acc)}
.fc .ln{font-size:14px;line-height:1.5;margin-top:8px}.fc .ln b{display:inline-block;min-width:62px;color:var(--sub);font-weight:600}
.fc .br{background:#EAF6EF;border-radius:10px;padding:8px 10px;margin-top:8px;font-size:14px;line-height:1.5}
.pal{display:flex;border-radius:14px;overflow:hidden;height:46px;margin:6px 0 12px;border:1px solid var(--line)}.pal div{flex:1}
.src{font-size:12px;color:var(--sub);word-break:break-all;margin:4px 0}
</style>
</head>
<body>
<div id="app"></div>
<script>
'use strict';
const AB=window.AndroidBridge||null;
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const LS={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v);}catch(e){return d;}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){toast('저장 공간이 꽉 찼어요. 오래된 리포트를 지워 주세요');}}};
function toast(t,ms=2600){const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),ms);}

/* ---------- 설정 ---------- */
let cfg={};try{cfg=AB?JSON.parse(AB.aiConfig()):{};}catch(e){cfg={};}
function apiKey(){return cfg.gemini||LS.get('key','');}

/* 봉헤치로 여성복 도매 기준 우선순위 (트렌드가 빨리 오고 브라질 시장에 바로 영향을 주는 순) */
const BRAND_TIERS=[
  ['🥇 꼭 볼 곳','유행이 제일 빨리 오고 브라질 도매에 바로 영향',['Zara','Shein','Farm Rio','Mango','Animale','Renner']],
  ['🥈 같이 보면 좋은 곳','브라질 매장·쇼핑몰 흐름',['Bershka','Riachuelo','C&A','Lança Perfume','Dress To','Maria Filó','Youcom']],
  ['🥉 참고','해외 SPA·브라질 고급 브랜드',['Stradivarius','H&M','Pull&Bear','Massimo Dutti','Zinzane','Forever 21']],
  ['💎 명품','1~2년 뒤 유행의 방향만 참고',['Miu Miu','Prada','Gucci','Chanel','Dior']],
];
const BRANDS=BRAND_TIERS.flatMap(t=>t[2]);
const COUNTRIES=[['es','🇪🇸 스페인'],['pt','🇵🇹 포르투갈'],['fr','🇫🇷 프랑스'],['it','🇮🇹 이탈리아'],['uk','🇬🇧 영국'],['de','🇩🇪 독일'],['us','🇺🇸 미국'],['kr','🇰🇷 한국'],['jp','🇯🇵 일본'],['cn','🇨🇳 중국'],['mx','🇲🇽 멕시코'],['ar','🇦🇷 아르헨티나'],['cl','🇨🇱 칠레'],['co','🇨🇴 콜롬비아'],['br','🇧🇷 브라질']];
const cName=c=>(COUNTRIES.find(x=>x[0]===c)||[c,c])[1].replace(/^\S+\s/,'');
const SHOWS=[['paris','🇫🇷 파리'],['milan','🇮🇹 밀라노'],['ny','🇺🇸 뉴욕'],['london','🇬🇧 런던'],['seoul','🇰🇷 서울'],['spfw','🇧🇷 상파울루(SPFW)'],['cph','🇩🇰 코펜하겐'],['tokyo','🇯🇵 도쿄']];
const MARKETS=[['shein','SHEIN'],['temu','Temu'],['aliexpress','AliExpress'],['shopee','Shopee'],['tiktok','TikTok Shop'],['meli','Mercado Livre']];
const SPECIAL={shows:'👠 패션쇼 동향',people:'⭐ 인플루언서·셀럽 의상',market:'🛒 쇼핑몰 베스트셀러',forecast:'🔮 2027 전망 · 요점 정리'};
const SECTIONS=[
  {id:'steady',icon:'🔁',title:'스테디 모델',long:'몇 년째 계속 다시 만드는 모델'},
  {id:'push',icon:'🔥',title:'2026 주력',long:'2026년에 가장 크게 민 모델'},
  {id:'newin',icon:'🆕',title:'지금 신상',long:'고른 나라 매장에 막 나온 신상'},
];
const secsOf=rep=>(rep&&rep.secs)||SECTIONS;
const flag=c=>(COUNTRIES.find(x=>x[0]===c)||['',''])[1].split(' ')[0];

const S={
  picked:LS.get('picked',['Zara']),
  countries:LS.get('countries',['es','us','kr']),
  shows:LS.get('shows',['paris','milan','ny','seoul']),
  pcountries:LS.get('pcountries',['kr','us','br']),
  markets:LS.get('markets',['shein','temu']),
  ncolors:LS.get('ncolors',7),
  onlyOk:LS.get('onlyOk',false),
  index:LS.get('index',[]),   // [{key,name,at}]
  view:'home',rep:null,sec:'steady',sort:'base',detail:null,
};
const saveIndex=()=>LS.set('index',S.index);
const repKey=n=>n.toLowerCase().replace(/\s+/g,' ').trim();
function loadRep(key){return LS.get('r:'+key,null);}
function saveRep(rep){
  LS.set('r:'+rep.key,rep);
  const i=S.index.findIndex(x=>x.key===rep.key);const row={key:rep.key,name:rep.name,at:rep.at,thumb:firstImg(rep)};
  if(i>=0)S.index[i]=row;else S.index.unshift(row);saveIndex();
}
function firstImg(rep){for(const s of secsOf(rep)){const it=((rep.sections||{})[s.id]||{}).items||[];for(const x of it)if(x.imgs&&x.imgs[0])return x.imgs[0];}return '';}
const img=u=>!u?'':(AB&&/^https?:/.test(u)?'/img?u='+encodeURIComponent(u):u);

/* ---------- 구글 AI (Gemini + 구글 검색) ---------- */
const MODELS=['gemini-flash-latest','gemini-2.5-flash','gemini-2.5-flash-lite'];
const askWait={};
window.__ask=(id,ok,payload)=>{const w=askWait[id];if(!w)return;delete askWait[id];
  if(ok){let d={};try{d=JSON.parse(payload);}catch(e){}w.res({text:d.text||'',sources:(d.sources||[]).filter(Boolean)});}else w.rej(new Error(payload));};
function nativeAsk(prompt,search){return new Promise((res,rej)=>{const id='a'+Date.now().toString(36)+Math.random().toString(36).slice(2);askWait[id]={res,rej};
  setTimeout(()=>{if(askWait[id]){delete askWait[id];rej(new Error('시간이 너무 오래 걸렸어요'));}},420000);AB.ask(id,prompt,!!search);});}
async function gemini(prompt,{search=true,signal}={}){
  if(AB&&AB.ask)return nativeAsk(prompt,search);
  const key=apiKey();if(!key)throw new Error('NOKEY');
  let last='';
  for(const m of MODELS){
    let r;
    try{
      r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${m}:generateContent`,{method:'POST',signal,
        headers:{'content-type':'application/json','x-goog-api-key':key},
        body:JSON.stringify({contents:[{role:'user',parts:[{text:prompt}]}],...(search?{tools:[{google_search:{}}]}:{}),generationConfig:{temperature:0.35}})});
    }catch(e){if(signal&&signal.aborted)throw e;last='인터넷 연결을 확인해 주세요';continue;}
    const d=await r.json().catch(()=>({}));
    if(!r.ok){const msg=(d.error&&d.error.message)||('http '+r.status);
      if(r.status===400&&/API key/i.test(msg))throw new Error('BADKEY');
      if(/billing|FAILED_PRECONDITION/i.test(msg))last='구글 AI 결제(카드) 연결이 필요해요';else last=msg;continue;}
    const c=(d.candidates||[])[0]||{};
    const text=((c.content&&c.content.parts)||[]).map(p=>p.text||'').join('');
    const sources=(((c.groundingMetadata||{}).groundingChunks)||[]).map(x=>x.web).filter(Boolean);
    if(text)return {text,sources};
    last='AI가 빈 답을 줬어요';
  }
  throw new Error(last||'AI 오류');
}
function parseJSON(t){
  t=String(t).replace(/```json|```/g,'');
  const a=Math.min(...['{','['].map(ch=>{const i=t.indexOf(ch);return i<0?1e9:i;}));
  if(a===1e9)throw new Error('JSON');
  const close=t[a]==='{'?'}':']';const b=t.lastIndexOf(close);
  let s=t.slice(a,b+1);
  try{return JSON.parse(s);}catch(e){}
  s=s.replace(/,\s*([}\]])/g,'$1').replace(/[“”]/g,'"');
  return JSON.parse(s);
}
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};

function who(rep){
  const i=rep.info||{};
  return `조사 대상: "${rep.name}"`+(i.name&&i.name!==rep.name?` (정식 이름: ${i.name})`:'')+(i.where?` / 위치·종류: ${i.where}`:'')+
    (i.instagram?` / 인스타그램: ${i.instagram}`:'')+(i.site?` / 사이트: ${i.site}`:'')+(i.desc?` / 설명: ${i.desc}`:'');
}
const ITEM_SPEC=`각 모델(items)마다 아래 칸을 채워:
{"name":"상품/모델 이름(원래 언어 그대로)","type":"종류(한국어: 바지, 블라우스, 까자코(재킷), 원피스, 니트, 셔츠, 스커트, 세트 등)",
 "desc":"어떤 옷인지 한국어 한 줄 (디자인 특징: 넥라인, 소매, 기장, 디테일)",
 "colors":["나온 색 (한국어)"],
 "fabric":"원단 성분. 공식 상품 페이지에 있으면 그대로 (예: 리넨 55%, 비스코스 45%)",
 "fabricGuess":false,  (성분 표시가 없어 사진·설명으로 추측했으면 true)
 "fabricPt":"봉헤치로 원단 가게에서 찾을 때 부르는 포르투갈어 원단 이름 (예: viscolinho, alfaiataria, crepe, malha canelada)",
 "fit":"핏·실루엣 (예: 오버핏, 크롭, 와이드, 슬림)",
 "price":"현지 판매가 (통화 표시, 모르면 빈칸)",
 "countries":["이 모델이 나온 나라 (한국어 나라 이름)"],
 "brazil":{"score":0~100,"why":"브라질에서 팔릴 가능성 이유 한두 줄"},
 "url":"바로 이 상품의 공식 상품 페이지 주소 (다른 상품 페이지·목록 페이지 주소를 넣으면 안 됨) — 검색에서 실제로 확인한 주소만, 모르면 빈칸",
 "confidence":0~100,  (이 모델 정보가 맞을 확률: 공식 상품 페이지에서 이름·원단·가격을 직접 확인했으면 85 이상, 기사·리뷰로 확인 60~80, 추측이면 50 이하)
 "img":"상품 사진 파일 주소를 확실히 알면 (모르면 빈칸)",
 "video":"이 모델이 나오는 유튜브 영상 주소가 있으면 (없으면 빈칸)"}

function forecastDigest(rep){
  const L=[];const sec=id=>((rep.sections||{})[id]||{});
  const c=sec('color').items||[];if(c.length)L.push('[색] '+c.map(x=>`${x.group||''}:${x.name}`).join(', '));
  const f=sec('fabric').items||[];if(f.length)L.push('[원단] '+f.map(x=>`${x.name}(${x.namePt||''}) ${x.outlook||''}`).join(' / '));
  const m=sec('mills').items||[];if(m.length)L.push('[브라질 원단 회사] '+m.map(x=>`${x.name}: ${(x.fabrics||[]).join(',')} / ${(x.colors||[]).join(',')}`).join(' | '));
  const it=sec('item').items||[];if(it.length)L.push('[아이템] '+it.map(x=>`${x.name}(${(x.brazil||{}).score??''})`).join(', '));
  // 다른 리포트에서 브라질 점수 높은 모델
  const hi=[];for(const r of S.index){const rp=loadRep(r.key);if(!rp||rp.kind==='forecast')continue;
    for(const s of secsOf(rp))for(const x of ((rp.sections||{})[s.id]||{}).items||[])if(((x.brazil||{}).score||0)>=80)hi.push(`${rp.name}:${x.name}(${x.type||''},${x.fabric||''})`);}
  if(hi.length)L.push('[저장한 리포트에서 브라질 점수 80 이상] '+hi.slice(0,30).join(' | '));
  return L.join('\n').slice(0,12000);
}
/* 저장한 리포트들에서 많이 나온 원단·색 (전망할 때 근거로) */
function savedContext(){
  const fab={},col={},names=[];
  for(const r of S.index){const rp=loadRep(r.key);if(!rp||rp.kind==='forecast')continue;names.push(rp.name);
    for(const s of secsOf(rp))for(const x of ((rp.sections||{})[s.id]||{}).items||[]){
      const f=String(x.fabric||'').replace(/\d+\s*%/g,'').split(/[,/+·]/).map(t=>t.trim()).filter(t=>t&&t.length<20);
      f.forEach(t=>fab[t]=(fab[t]||0)+1);(x.colors||[]).forEach(c=>{c=String(c).trim();if(c)col[c]=(col[c]||0)+1;});}}
  const top=o=>Object.entries(o).sort((a,b)=>b[1]-a[1]).slice(0,15).map(([k,v])=>`${k}(${v})`).join(', ');
  if(!names.length)return '';
  return `리포트: ${names.slice(0,20).join(', ')}\n원단: ${top(fab)}\n색: ${top(col)}`;
}

async function research(name,{reuseInfo,kind='brand',secs}={}){
  const key=repKey(name);
  if(running[key])return;
  running[key]=true;
  workBegin(name);
  let rep=loadRep(key)||{key,name,sections:{}};
  rep.name=name;rep.at=Date.now();rep.countries=S.countries.slice();rep.sections={};
  rep.kind=kind;if(kind==='forecast')rep.ncolors=S.ncolors;if(secs)rep.secs=secs;else if(kind==='brand')delete rep.secs;
  rep.status=kind==='brand'?'identify':'run';
  saveRep(rep);render();
  try{
    if(kind==='brand'&&!(reuseInfo&&rep.info)){
      let info=null;
      try{
        const c=await identify(name);
        if(c.length===1)info=c[0];
        else if(c.length>1)info=await askPick(name,c);
      }catch(e){if(/NOKEY|BADKEY/.test(e.message))throw e;}
      rep.info=info||{name};
    }
    rep.status='run';
    for(const s of secsOf(rep))rep.sections[s.id]={status:'run',items:[]};
    saveRep(rep);render();
    const all=secsOf(rep),later=rep.kind==='forecast'?all.filter(s=>s.id==='brief'):[];
    await Promise.all(all.filter(s=>!later.includes(s)).map(s=>runSection(rep,s)));
    for(const s of later)await runSection(rep,s);
    rep.status='done';saveRep(rep);render();
    const n=secsOf(rep).reduce((a,s)=>a+((rep.sections[s.id]||{}).items||[]).length,0);
    const bad=secsOf(rep).filter(s=>(rep.sections[s.id]||{}).status==='error').length;
    toast(`✅ ${name} 조사 끝!`);
    notifyDone(`✅ ${name} 조사 끝!`,`${n}개를 찾았어요${bad?` (${bad}개 항목 오류)`:''} · 눌러서 보기`,key);
  }catch(e){
    rep.status='error';rep.error=errMsg(e);saveRep(rep);render();
    notifyDone(`⚠️ ${name} 조사 실패`,rep.error,key);
  }finally{delete running[key];workEnd();}
}

const BAD_IMG=/\.svg(\?|$)|logo|icon|sprite|pixel|blank|transparent|placeholder|favicon|avatar|badge|flag/i;
function imgsFromHtml(html,base){
  const out=[],seen=new Set();
  const add=u=>{if(!u||typeof u!=='string')return;u=u.replace(/&amp;/g,'&').trim();try{u=new URL(u,base).href;}catch(e){return;}
    if(!/^https?:/.test(u)||BAD_IMG.test(u)||seen.has(u))return;seen.add(u);out.push(u);};
  let doc;try{doc=new DOMParser().parseFromString(html,'text/html');}catch(e){return out;}
  doc.querySelectorAll('meta[property="og:image"],meta[name="og:image"],meta[property="og:image:secure_url"],meta[name="twitter:image"],link[rel="image_src"]').forEach(m=>add(m.getAttribute('content')||m.getAttribute('href')));
  const walk=o=>{if(!o)return;if(Array.isArray(o)){o.forEach(walk);return;}if(typeof o==='object'){for(const k in o){const v=o[k];
    if(k==='image'||k==='images'||k==='contentUrl'||k==='thumbnailUrl'){if(typeof v==='string')add(v);else if(Array.isArray(v))v.forEach(x=>typeof x==='string'?add(x):x&&add(x.url||x.contentUrl));else if(v&&typeof v==='object')add(v.url||v.contentUrl);}
    else if(typeof v==='object')walk(v);}}};
  doc.querySelectorAll('script[type="application/ld+json"]').forEach(s=>{try{walk(JSON.parse(s.textContent));}catch(e){}});
  doc.querySelectorAll('img').forEach(im=>{
    const ss=im.getAttribute('srcset')||im.getAttribute('data-srcset');
    if(ss){const best=ss.split(',').map(x=>{x=x.trim().split(/\s+/);return{u:x[0],w:parseInt(x[1]||'0',10)};}).sort((a,b)=>b.w-a.w)[0];if(best&&best.w>=400){add(best.u);return;}}
    const w=parseInt(im.getAttribute('width')||'0',10);const src=im.getAttribute('data-src')||im.getAttribute('src');
    if(src&&(w>=350||/product|photos|media|cdn|images/i.test(src))&&!/^data:/.test(src))add(src);
  });
  return out.slice(0,14);
}
/* ---- 이름과 페이지가 맞는지 검사 ---- */
const deacc=t=>String(t||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
const STOP=new Set(['com','de','da','do','das','dos','e','em','the','and','with','for','women','womens','feminino','feminina','new','de','la','el','con','y','para']);
function nameTokens(n){return deacc(n).split(/[^a-z0-9\uac00-\ud7a3]+/).filter(t=>t.length>=3&&!STOP.has(t));}
function matchRatio(name,hay){const tk=nameTokens(name);if(!tk.length)return 0;const h=deacc(hay);return tk.filter(t=>h.includes(t)).length/tk.length;}
function slugify(n){return deacc(n).replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');}
function pageInfo(html,base){
  let doc;try{doc=new DOMParser().parseFromString(html,'text/html');}catch(e){return null;}
  const meta=sel=>{const m=doc.querySelector(sel);return m?(m.getAttribute('content')||''):'';};
  const h1=doc.querySelector('h1');
  const info={title:doc.title||'',og:meta('meta[property="og:title"]'),h1:h1?h1.textContent.trim():'',text:'',ld:[],ogimg:[],imgs:[]};
  const add=(arr,u)=>{if(!u||typeof u!=='string')return;u=u.replace(/&amp;/g,'&').trim();try{u=new URL(u,base).href;}catch(e){return;}if(/^https?:/.test(u)&&!BAD_IMG.test(u)&&!arr.includes(u))arr.push(u);};
  ['meta[property="og:image"]','meta[name="og:image"]','meta[property="og:image:secure_url"]','meta[name="twitter:image"]'].forEach(q=>doc.querySelectorAll(q).forEach(m=>add(info.ogimg,m.getAttribute('content'))));
  // JSON-LD: 상품(Product) 정보의 사진만
  const prods=[];const walk=o=>{if(!o)return;if(Array.isArray(o)){o.forEach(walk);return;}if(typeof o!=='object')return;
    const t=[].concat(o['@type']||[]).join(',');if(/Product/i.test(t))prods.push(o);for(const k in o)if(typeof o[k]==='object')walk(o[k]);};
  doc.querySelectorAll('script[type="application/ld+json"]').forEach(s=>{try{walk(JSON.parse(s.textContent));}catch(e){}});
  info.prods=prods.map(p=>({name:p.name||'',imgs:[].concat(p.image||[]).map(x=>typeof x==='string'?x:(x&&(x.url||x.contentUrl))).filter(Boolean)}));
  // 상품 사진 (alt에 상품 이름이 있는 것)
  doc.querySelectorAll('img').forEach(im=>{
    const ss=im.getAttribute('srcset')||im.getAttribute('data-srcset');let src=im.getAttribute('data-src')||im.getAttribute('src');
    if(ss){const best=ss.split(',').map(x=>{x=x.trim().split(/\s+/);return{u:x[0],w:parseInt(x[1]||'0',10)};}).sort((a,b)=>b.w-a.w)[0];if(best)src=best.u;}
    if(src&&!/^data:/.test(src))info.imgs.push({u:src,alt:im.getAttribute('alt')||''});});
  info.text=(doc.body?doc.body.textContent:'').replace(/\s+/g,' ').slice(0,40000);
  return info;
}
function pickImages(info,name,base){
  const out=[];const add=u=>{if(!u)return;try{u=new URL(u,base).href;}catch(e){return;}if(/^https?:/.test(u)&&!BAD_IMG.test(u)&&!out.includes(u))out.push(u);};
  // 1) 이름이 맞는 상품 정보의 사진
  const p=(info.prods||[]).map(p=>({p,r:matchRatio(name,p.name)})).sort((a,b)=>b.r-a.r)[0];
  if(p&&(p.r>=0.5||(info.prods.length===1)))p.p.imgs.forEach(add);
  // 2) 대표 사진
  (info.ogimg||[]).forEach(add);
  // 3) 사진 설명(alt)에 상품 이름이 들어간 사진만 (추천 상품 사진은 빼기)
  if(out.length<4)(info.imgs||[]).forEach(x=>{if(x.alt&&matchRatio(name,x.alt)>=0.6)add(x.u);});
  return out.slice(0,10);
}
function fabricCheck(fabric,text){
  const nums=String(fabric||'').match(/\d+(?:[.,]\d+)?\s*%/g)||[];if(!nums.length)return false;
  const t=String(text||'').replace(/\s+/g,'');
  return nums.every(n=>{const v=n.replace(/\s|%/g,'');return t.includes(v+'%')||t.includes(v.replace('.',',')+'%')||t.includes(v.replace(',','.')+'%');});
}
async function fetchInfo(url){
  try{const r=await fetch('/fetch?u='+encodeURIComponent(url));const d=await r.json();
    if(!d.html||d.status>=400)return null;const info=pageInfo(d.html,d.url||url);if(info)info.url=d.url||url;return info;}catch(e){return null;}
}
/* 이미지 검색 (빙): 제목이 상품 이름과 맞는 사진만 */
async function imageSearch(q,name,brand){
  if(!AB)return [];
  try{
    const r=await fetch('/fetch?u='+encodeURIComponent('https://www.bing.com/images/search?q='+encodeURIComponent(q)+'&form=HDRSC2&first=1'));
    const d=await r.json();if(!d.html)return [];
    const out=[];const re=/\bm="(\{[^"]*?\})"/g;let m;
    while((m=re.exec(d.html))&&out.length<40){
      let o;try{o=JSON.parse(m[1].replace(/&quot;/g,'"').replace(/&amp;/g,'&'));}catch(e){continue;}
      if(!o.murl)continue;
      const ratio=matchRatio(name,(o.t||'')+' '+decodeURIComponent(o.purl||'').replace(/[-_/]/g,' ')+' '+decodeURIComponent(o.murl).replace(/[-_/]/g,' '));
      const own=brand&&deacc(o.purl||'').includes(deacc(brand).replace(/[^a-z0-9]/g,''));
      out.push({u:o.murl,page:o.purl||'',ratio,own});
    }
    return out.filter(x=>x.ratio>=0.6&&!BAD_IMG.test(x.u)).sort((a,b)=>(b.own-a.own)||(b.ratio-a.ratio));
  }catch(e){return [];}
}
/* 상품 페이지가 이 이름의 상품인지 확인하고, 그 상품 사진만 가져옴 */
async function checkItem(it,brand){
  const res={imgs:[],verify:'nopage',fabricOk:false,page:''};
  if(!AB)return res;
  const tryUrl=async u=>{
    let info=await fetchInfo(u);
    let ratio=info?Math.max(matchRatio(it.name,info.title+' '+info.og+' '+info.h1),matchRatio(it.name,decodeURIComponent(info.url||u).replace(/[-_/]/g,' '))):0;
    let imgs=info?pickImages(info,it.name,info.url):[];
    if(!info||(ratio>=0.6&&imgs.length<1)){ // 글자로 안 나오면 보이지 않는 브라우저로 열어 보기
      const rd=await renderPage(info&&info.url||u);
      if(rd&&(rd.title||rd.h1||rd.og)){const r2=matchRatio(it.name,(rd.title||'')+' '+(rd.og||'')+' '+(rd.h1||''));
        if(!info||r2>ratio){ratio=Math.max(ratio,r2);info=info||{text:'',url:u};info.text=(info.text||'')+' '+(rd.text||'');}
        if(ratio>=0.6&&imgs.length<1)imgs=(rd.imgs||[]).slice(0,4);}
    }
    return {info,ratio,imgs};
  };
  if(it.url&&/^https?:/.test(it.url)){
    let r=await tryUrl(it.url);
    // 다른 상품 페이지면: 같은 사이트에서 이름으로 된 주소를 짐작해서 다시 시도
    if(r.ratio<0.6){
      let origin='';try{origin=new URL(r.info&&r.info.url||it.url).origin;}catch(e){}
      const sl=slugify(it.name);
      if(origin&&sl){const gs=[`${origin}/${sl}/p`,`${origin}/products/${sl}`,`${origin}/produto/${sl}`];
        const rs=await Promise.all(gs.map(g=>fetchInfo(g).then(info=>({g,info,ratio:info?matchRatio(it.name,info.title+' '+info.og+' '+info.h1):0}))));
        const best=rs.sort((a,b)=>b.ratio-a.ratio)[0];
        if(best&&best.ratio>=0.6){r={info:best.info,ratio:best.ratio,imgs:pickImages(best.info,it.name,best.info.url)};it.url=best.info.url||best.g;}}
    }
    if(r.info){res.page=r.info.url||it.url;
      if(r.ratio>=0.6){res.verify='ok';res.imgs=r.imgs;res.fabricOk=fabricCheck(it.fabric,r.info.text);}
      else res.verify='mismatch';}
  }
  // 사진 주소를 AI가 직접 준 경우: 페이지 확인이 안 됐으면 쓰지 않음
  if(it.img&&/^https?:/.test(it.img)&&res.verify==='ok'&&!res.imgs.includes(it.img))res.imgs.push(it.img);
  // 페이지를 못 열었거나 사진이 없으면: 이미지 검색에서 이름이 맞는 사진 찾기
  if(!res.imgs.length){
    const found=await imageSearch(`${brand||''} ${it.name}`.trim(),it.name,brand);
    if(found.length){res.imgs=found.slice(0,6).map(x=>x.u);if(res.verify!=='ok'){res.verify='search';res.page=found[0].page;}}
  }
  if(!res.imgs.length&&res.verify!=='mismatch'&&ytId(it.video))res.imgs.push(`https://i.ytimg.com/vi/${ytId(it.video)}/hqdefault.jpg`);
  return res;
}
/* 신뢰도 % = AI 확신 + 실제 확인 결과 */
function trust(x){
  if(x.imgState!==2||!x.verify)return null;
  const ai=Math.max(0,Math.min(100,+(x.confidence)||60));
  let t=ai*0.5+(x.verify==='ok'?35:x.verify==='search'?25:x.verify==='nopage'?10:0)+(x.fabricOk?15:x.fabricGuess?0:5);
  if(x.verify==='mismatch')t=Math.min(t,40);
  return Math.max(5,Math.min(99,Math.round(t)));
}
const trustCls=t=>t>=75?'g':t>=50?'m':'r';
async function pageImages(url){
  if(!AB||!/^https?:/.test(url||''))return [];
  let list=[];
  try{const r=await fetch('/fetch?u='+encodeURIComponent(url));const d=await r.json();
    if(d.html&&d.status<400)list=imgsFromHtml(d.html,d.url||url);
    if(list.length<2){const more=await renderPage(d.url||url);for(const u of more)if(!list.includes(u)&&!BAD_IMG.test(u))list.push(u);}
  }catch(e){}
  return list.slice(0,12);
}
function ytId(u){const m=String(u||'').match(/(?:v=|youtu\.be\/|shorts\/|embed\/)([\w-]{11})/);return m?m[1]:'';}
let imgPool=0;const imgQueue=[];
function queueImg(job){imgQueue.push(job);pump();}
function pump(){while(imgPool<6&&imgQueue.length){const j=imgQueue.shift();imgPool++;j().finally(()=>{imgPool--;pump();});}}
function fillImages(rep,secId){
  const sec=rep.sections[secId];if(!sec||!sec.items)return;
  sec.items.forEach((it,i)=>{
    if(it.imgState===2&&it.verify&&(it.cv===2||(it.imgs||[]).length))return;
    it.imgState=1;
    queueImg(async()=>{
      const r=await checkItem(it,rep.kind&&rep.kind!=='brand'?(it.brands||[])[0]||'':((rep.info||{}).name||rep.name));const list=r.imgs;
      it.imgs=list;it.imgState=2;it.verify=r.verify;it.cv=2;it.fabricOk=r.fabricOk;it.page=r.page;
      saveRep(rep);
      if(S.rep===rep.key&&S.sec===secId&&S.view==='report'&&!S.detail)render();
      if(S.detail&&S.detail.sec===secId&&S.detail.i===i&&S.rep===rep.key)render();
    });
  });
}

function trustHTML(x){
  const t=trust(x);if(t==null)return x.imgState===1?'<div class="card"><span class="spin"></span>정보가 맞는지 확인하는 중…</div>':'';
  const v={ok:'✅ 상품 페이지에서 이 이름의 상품을 확인했어요',mismatch:'⚠️ AI가 준 주소가 다른 상품 페이지였어요 — 사진은 빼고 보여줘요',search:'🔎 상품 페이지는 막혀 있어서, 이미지 검색에서 이름이 같은 사진을 찾았어요',nopage:'➖ 상품 페이지를 열지 못해서 확인을 못 했어요'}[x.verify]||'';
  return `<div class="card score"><div class="c" style="background:var(--${trustCls(t)==='g'?'ok':trustCls(t)==='m'?'mid':'sub'})">${t}%</div>
    <div style="font-size:13.5px;line-height:1.55"><b>정보 신뢰도</b><div>${v}</div>
    <div>${x.fabricOk?'✅ 원단 성분이 페이지 표시와 같아요':x.fabricGuess?'➖ 원단은 사진·설명으로 추측했어요':'➖ 원단 성분은 페이지에서 확인 못 했어요'}</div>
    <div class="muted">AI 확신 ${esc(x.confidence??'?')}%</div></div></div>`;
}
function settingsHTML(){
  const w=getWatch();
  return `<div class="wrap"><div class="top"><button class="back" data-act="home">‹</button><div class="ttl"><b>설정</b></div></div>
  <div class="card"><b>구글 AI 키</b><div class="muted" style="margin:4px 0 10px">${cfg.built?'✅ 앱에 키가 들어 있어요 (GitHub 비밀값)':'aistudio.google.com 에서 만든 키를 붙여 넣으세요'}</div>
    ${cfg.built?'':`<div class="row"><input class="inp" id="keyIn" type="password" placeholder="AIza..." value="${esc(LS.get('key',''))}"><button class="btn" data-act="savekey">저장</button></div>`}
    <button class="btn ghost big" data-act="testkey" style="margin-top:10px">🔌 연결 시험</button></div>
  <div class="card"><b>🔔 새 상품 알림</b><div class="muted" style="margin:4px 0 8px">하루 한 번 확인해요. 리포트 화면 오른쪽 위 🔕를 누르면 추가돼요</div>
    ${w.length?w.map(x=>`<div class="sw" style="padding:8px 0;border-top:1px solid var(--line)"><span>${esc(x.name)} <span class="muted">${esc(x.countries||'')}</span></span><button class="chip" data-act="unwatch" data-v="${esc(x.name)}">끄기</button></div>`).join(''):'<div class="muted">아직 없어요</div>'}
    ${w.length&&AB?'<button class="btn ghost big" data-act="checknow">지금 바로 확인</button>':''}</div>
  <div class="card"><b>저장 공간</b><div class="muted" style="margin:4px 0 8px">리포트 ${S.index.length}개</div><button class="btn ghost big" data-act="clearall">🗑 리포트 모두 지우기</button></div>
  <div class="muted" style="text-align:center;margin-top:16px">트렌드 레이더 · 개인용 · v${esc(cfg.version||'web')}</div></div>`;
}
function newsHTML(){
  const n=getNews().slice().reverse();
  return `<div class="wrap"><div class="top"><button class="back" data-act="home">‹</button><div class="ttl"><b>🆕 새 상품 소식</b></div>${n.length?'<button class="chip" data-act="clearnews">모두 지우기</button>':''}</div>
  ${n.length?n.map(x=>`<button class="pick" data-act="url" data-v="${esc(x.url||'https://www.google.com/search?tbm=isch&q='+encodeURIComponent(x.brand+' '+x.name))}"><b>${esc(x.name)}</b><div class="muted">${esc(x.brand)} · ${esc(x.type||'')} · ${esc(x.at||'')}</div></button>`).join(''):'<div class="muted">새 소식이 없어요</div>'}</div>`;
}

/* ---------- 버튼 ---------- */
function bind(){
  const ki=$('#keyIn');if(ki)ki.oninput=()=>saveKey(ki.value);
  const inp=$('#brandIn');if(inp)inp.onkeydown=e=>{if(e.key==='Enter')act('add');};
  const ta=$('#askIn');if(ta){const fit=()=>{ta.style.height='auto';ta.style.height=Math.min(120,ta.scrollHeight)+'px';};fit();ta.oninput=()=>{S.askDraft=ta.value;fit();};}
  const ss=$('#sortSel');if(ss){ss.value=S.sort;ss.onchange=()=>{S.sort=ss.value;render();};}
  const g=$('#gal');if(g)g.onscroll=()=>{const c=$('#galcnt');if(c)c.textContent=`${Math.round(g.scrollLeft/g.clientWidth)+1} / ${g.children.length}`;};
}
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;act(b.dataset.act,b.dataset.v,b);});
function curItem(){const rep=loadRep(S.rep);return rep&&S.detail?((rep.sections||{})[S.detail.sec]||{}).items?.[S.detail.i]:null;}
function curImg(){const x=curItem();if(!x||!x.imgs||!x.imgs.length)return '';const g=$('#gal');const i=g?Math.round(g.scrollLeft/g.clientWidth):0;return x.imgs[Math.min(i,x.imgs.length-1)];}
function openUrl(u){if(!u)return;if(AB)AB.open(u);else window.open(u,'_blank');}
async function act(a,v,el){
  if(a==='add'){const i=$('#brandIn');const t=(i.value||'').trim();if(!t)return;if(!S.picked.includes(t))S.picked.push(t);LS.set('picked',S.picked);render();}
  else if(a==='pick'){S.picked.push(v);LS.set('picked',S.picked);render();}
  else if(a==='unpick'){S.picked=S.picked.filter(x=>x!==v);LS.set('picked',S.picked);render();}
  else if(a==='country'){S.countries=S.countries.includes(v)?S.countries.filter(x=>x!==v):[...S.countries,v];LS.set('countries',S.countries);render();}
  else if(a==='go'){
    if(!apiKey()){toast('먼저 ⚙️ 설정에서 구글 AI 키를 넣어 주세요');S.view='settings';render();return;}
    const list=S.picked.slice();
    S.rep=repKey(list[0]);S.view='report';S.sec='steady';S.sort='base';
    // 상호 확인 창이 겹치지 않게 한 곳씩 시작 (조사는 동시에 진행)
    (async()=>{for(const n of list){const p=research(n);await waitPhase(repKey(n));p;}})();
    setTimeout(render,50);
  }
  else if(a==='open'){const rep=loadRep(v);S.rep=v;S.view='report';S.sec=rep?secsOf(rep)[0].id:'steady';S.sort='base';render();if(rep)secsOf(rep).forEach(s=>{const sec=(rep.sections||{})[s.id];if(sec&&sec.items&&sec.items.some(x=>x.imgState!==2||!x.verify||(x.cv!==2&&!(x.imgs||[]).length))&&!running[v]&&!(rep.kind==='forecast'&&s.id!=='item'))fillImages(rep,s.id);});}
  else if(a==='home'){S.view='home';S.detail=null;render();}
  else if(a==='settings'){S.view='settings';render();}
  else if(a==='news'){S.view='news';render();}
  else if(a==='tab'){S.sec=v;S.sort='base';render();window.scrollTo(0,0);}
  else if(a==='detail'){S.detail={sec:S.sec,i:+el.dataset.i};render();}
  else if(a==='close'){S.detail=null;render();}
  else if(a==='redo'){const rep=loadRep(S.rep);if(rep&&!running[rep.key]){if(!confirm2('다시 조사할까요? (지금 결과는 새 결과로 바뀌어요)'))return;research(rep.name,{reuseInfo:true,kind:rep.kind||'brand',secs:rep.secs});}}
  else if(a==='ask'){const t=$('#askIn');const q=t?t.value:'';S.askDraft='';askQuestion(q);}
  else if(a==='askex'){askQuestion(v);}
  else if(a==='askitem'){const x=curItem();if(!x)return;S.detail=null;S.sec='qa';S.askDraft=`"${x.name}" 이 옷에 대해: `;render();scrollBottom();setTimeout(()=>{const t=$('#askIn');if(t){t.focus();t.setSelectionRange(t.value.length,t.value.length);}},80);}
  else if(a==='findaddr'){findAddress(S.rep);}
  else if(a==='reident'){const rep=loadRep(S.rep);if(rep&&!running[rep.key]&&confirm2('같은 이름의 다른 가게를 찾아서 처음부터 다시 조사할까요?'))research(rep.name,{kind:'brand'});}
  else if(a==='retrysec'){retrySection(v);}
  else if(a==='special'){if(!apiKey()&&!(AB&&AB.ask)){toast('먼저 ⚙️ 설정에서 키를 넣어 주세요');return;}const secs=specialSecs(v);if(!secs.length){toast('먼저 골라 주세요');return;}special(v);S.rep=repKey(SPECIAL[v]);S.view='report';S.sec=secs[0].id;S.sort='base';setTimeout(render,50);}
  else if(a==='market'){S.markets=S.markets.includes(v)?S.markets.filter(x=>x!==v):[...S.markets,v];LS.set('markets',S.markets);render();}
  else if(a==='ncolors'){S.ncolors=+v;LS.set('ncolors',S.ncolors);render();}
  else if(a==='show'){S.shows=S.shows.includes(v)?S.shows.filter(x=>x!==v):[...S.shows,v];LS.set('shows',S.shows);render();}
  else if(a==='pcountry'){S.pcountries=S.pcountries.includes(v)?S.pcountries.filter(x=>x!==v):[...S.pcountries,v];LS.set('pcountries',S.pcountries);render();}
  else if(a==='watch'){const rep=loadRep(S.rep);if(rep)toggleWatch(rep);}
  else if(a==='unwatch'){setWatch(getWatch().filter(x=>x.name!==v));render();}
  else if(a==='checknow'){AB&&AB.checkNow();}
  else if(a==='url'){openUrl(v);}
  else if(a==='vitrine'){const u=curImg();if(u&&AB)AB.sendToVitrine(u);else toast('앱에서만 돼요');}
  else if(a==='save'){const u=curImg();if(u&&AB)AB.saveImage(u);}
  else if(a==='sharetxt'){const x=curItem();const rep=loadRep(S.rep);if(!x)return;
    const t=`[${rep.name}] ${x.name}\n종류: ${x.type||''}\n${x.desc||''}\n원단: ${x.fabric||''}${x.fabricPt?' ('+x.fabricPt+')':''}\n색상: ${(x.colors||[]).join(', ')}\n가격: ${x.price||''}\n브라질 점수: ${(x.brazil||{}).score??''} — ${(x.brazil||{}).why||''}\n${x.url||''}`;
    if(AB)AB.shareText(t);else navigator.clipboard&&navigator.clipboard.writeText(t);}
  else if(a==='savekey'){saveKey($('#keyIn').value);toast('저장했어요');}
  else if(a==='testkey'){const ki=$('#keyIn');if(ki)saveKey(ki.value);toast('시험 중…');try{await gemini('"연결 성공" 이라고만 답해.',{search:false});toast('✅ 연결 성공!');}catch(e){toast('⚠️ '+errMsg(e),4000);}}
  else if(a==='onlyok'){S.onlyOk=!S.onlyOk;LS.set('onlyOk',S.onlyOk);render();}
  else if(a==='delrep'){
    if(running[v]){toast('조사 중에는 지울 수 없어요');return;}
    const r=loadRep(v);if(!confirm2(`"${r?r.name:v}" 리포트를 지울까요?`))return;
    try{localStorage.removeItem('r:'+v);}catch(e){}
    S.index=S.index.filter(x=>x.key!==v);saveIndex();
    if(r&&isWatched(v))setWatch(getWatch().filter(x=>repKey(x.name)!==v));
    if(S.rep===v){S.rep=null;S.view='home';S.detail=null;}
    toast('지웠어요');render();}
  else if(a==='clearqa'){const r=loadRep(S.rep);if(!r||!confirm2('질문 기록을 모두 지울까요?'))return;r.qa=[];saveRep(r);render();}
  else if(a==='clearall'){if(!confirm2('저장한 리포트를 모두 지울까요?'))return;S.index.forEach(r=>{try{localStorage.removeItem('r:'+r.key);}catch(e){}});S.index=[];saveIndex();render();}
  else if(a==='clearnews'){AB&&AB.setNews('[]');render();}
}
function saveKey(k){k=String(k||'').trim();LS.set('key',k);if(AB)AB.setKey(k);}
function confirm2(t){try{return window.confirm(t);}catch(e){return true;}}
async function waitPhase(key){for(let k=0;k<400;k++){const r=loadRep(key);if(r&&r.status!=='identify')return;await sleep(500);}}

window.__appBack=()=>{
  if(document.querySelector('.modal'))return true;
  if(S.detail){S.detail=null;render();return true;}
  if(S.view!=='home'){S.view='home';render();return true;}
  return false;
};
// 앱을 껐다 켜서 멈춘 조사는 오류로 표시
S.index.forEach(r=>{const rp=loadRep(r.key);if(rp&&(rp.status==='run'||rp.status==='identify')){rp.status=Object.values(rp.sections||{}).some(s=>s.status==='done')?'done':'error';rp.error=rp.error||'조사가 중간에 멈췄어요. ↻ 다시 조사를 눌러 주세요';
  for(const k in rp.sections||{})if(rp.sections[k].status==='run')rp.sections[k]={status:'error',error:'중간에 멈췄어요. ↻ 다시 조사',items:[]};LS.set('r:'+r.key,rp);}});
if(location.hash==='#news')S.view='news';
else if(location.hash.startsWith('#open=')){const k=decodeURIComponent(location.hash.slice(6));if(loadRep(k)){S.rep=k;S.view='report';}}
render();
</script>
</body>
</html>
