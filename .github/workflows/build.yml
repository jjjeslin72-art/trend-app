name: APK 만들기

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build debug APK
        shell: bash
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon 2>&1 | tee build.log

      - name: 오류 요약 (빌드 실패 시)
        if: failure()
        shell: bash
        run: |
          msg=$(grep -E "^e: |error:|What went wrong|Could not|> Task .* FAILED" -A2 build.log | head -80 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=build::${msg}"

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk TrendRadar-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: TrendRadar-${{ github.run_number }}
          path: TrendRadar-${{ github.run_number }}.apk

      - name: Publish to Releases (핸드폰에서 바로 받기)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: 트렌드 레이더 ${{ github.run_number }}
          body: 핸드폰에서 아래 APK 파일을 눌러 설치하세요.
          files: TrendRadar-${{ github.run_number }}.apk
          make_latest: true
